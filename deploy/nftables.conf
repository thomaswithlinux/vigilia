#!/usr/sbin/nft -f
# Pare-feu minimal pour un serveur Vigilia : entree refusee par defaut, SSH (limite) et HTTPS ouverts.
# Installation : copier vers /etc/nftables.conf puis `systemctl enable --now nftables`.
# Conseil : restreignez SSH aux postes d'administration, par exemple :
#     ip saddr 192.0.2.0/24 tcp dport 22 ct state new limit rate 20/minute burst 20 packets accept
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept
    tcp dport 22 ct state new limit rate 20/minute burst 20 packets accept
    tcp dport 443 accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
  chain output {
    type filter hook output priority 0; policy accept;
  }
}
