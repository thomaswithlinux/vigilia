# /etc/ssh/sshd_config.d/00-vigilia.conf : durcissement SSH du serveur.
# AVANT de l'appliquer : installez votre cle publique dans ~/.ssh/authorized_keys et testez-la
# depuis une AUTRE session. Verifiez la syntaxe avec `sshd -t`, puis `systemctl reload ssh`.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
